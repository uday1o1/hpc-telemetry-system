name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent-build-and-test:
    name: C++ agent build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libprotobuf-dev protobuf-compiler

      - name: Configure
        run: cmake -S agent -B agent/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build agent/build

      - name: Test
        run: ctest --test-dir agent/build --output-on-failure

  ingestion-build-and-test:
    name: Python ingestion build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Generate protobuf binding
        run: |
          mkdir -p ingestion/src/hpctel/_generated
          protoc --python_out=ingestion/src/hpctel/_generated -I proto proto/telemetry.proto
          touch ingestion/src/hpctel/_generated/__init__.py

      - name: Install package
        run: pip install -e "./ingestion[dev]"

      - name: Lint
        run: ruff check ingestion/src ingestion/tests

      - name: Test
        run: pytest -q
        working-directory: ingestion

  workload-build-and-test:
    name: Python workload runner build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Generate protobuf binding
        run: |
          mkdir -p workload/src/workloadrunner/_generated
          protoc --python_out=workload/src/workloadrunner/_generated -I proto proto/telemetry.proto
          touch workload/src/workloadrunner/_generated/__init__.py

      - name: Install package
        run: pip install -e "./workload[dev]"

      - name: Lint
        run: ruff check workload/src workload/tests

      - name: Test
        run: pytest -q
        working-directory: workload
